# Production deltas only. Cloud Run terminates TLS in front of the container, and the
# service-to-service world is Google ID tokens — the HS256 secret simply does not exist here.
server:
  forward-headers-strategy: framework

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed/prod
    placeholders:
      # Fixed, human-typeable demo credentials — stored ONLY in Secret Manager, injected as env
      # vars by terraform-core, hashed by pgcrypto inside the seed migration. No password, plain
      # or hashed, lives in this repository for production.
      seed_student_password: ${SEED_STUDENT_PASSWORD}
      seed_staff_password: ${SEED_STAFF_PASSWORD}

student360:
  security:
    service-token:
      mode: google
      secret: ""

auth:
  refresh-cookie:
    same-site: None
